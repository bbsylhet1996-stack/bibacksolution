<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Northstar SEO form registration</title></head>
  <body>
    <form name="seo-review" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="seo-review">
      <input name="bot-field">
      <input name="name">
      <input name="email" type="email">
      <input name="website" type="url">
      <select name="market"><option>USA</option><option>Canada</option><option>USA &amp; Canada</option><option>Worldwide</option></select>
      <textarea name="goals"></textarea>
      <input name="consent" type="checkbox" value="yes">
    </form>
  </body>
</html>
